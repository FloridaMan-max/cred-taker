<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 40px; 
            text-align: center; 
        }
        .box { 
            background: #f9f9f9; 
            padding: 20px; 
            border-radius: 8px; 
            display: inline-block; 
            border: 1px solid #ddd; 
        }
        a { 
            color: #1a73e8; 
            font-size: 18px; 
            text-decoration: none; 
            font-weight: bold; 
        }
        a:hover { 
            text-decoration: underline; 
        }
    </style>
</head>
<body>

    <div class="box">
        <h3>Account Verification Required</h3>
        <p>Please click the link below to access your account:</p>
        
        <!-- Place your link here inside the body -->
        <p><a href="http://localhost:3000/login.html">https://accounts.google.com/signin</a></p>
        
    </div>

</body>
</html>
